project:
  output-dir: _output
bibliography: msens.bib
bibliographystyle: apa
format:
  html:
    mermaid-format: png    # PNG so diagrams are zoomable via lightbox
    lightbox: true
    toc: true              # md to exclude: {.unnumbered .unlisted}
    toc-depth: 4
    toc-expand: 1
    number-sections: true  # md to exclude: {.unnumbered}
    number-depth: 4
    code-fold: true
    code-tools: true
    embed-resources: false # true for standalone
date: now
date-format: iso
execute:
  echo: true
  warning: false
  message: true
editor:
  mode: source
  markdown:
    wrap: 72
  canonical: true
editor_options:
  chunk_output_type: console    
search: false
