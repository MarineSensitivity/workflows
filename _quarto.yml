project:
  output-dir: _output
bibliography: msens.bib
bibliographystyle: apa
format:
  html:
    # mermaid-format: png  # DISABLED — PNG made diagrams zoomable via lightbox,
    #   but it routes every {mermaid} block through headless Chrome, which hangs
    #   intermittently and unpredictably. Diagnosed in the sibling
    #   CalCOFI/workflows (2026-07-30): one small (60 KB) diagram wedged 3h15m at
    #   0.2% CPU after rendering in ~2 min the run before, ignored SIGTERM, and
    #   silently took down two tar_make() runs. Default (JS, client-side) mermaid
    #   needs no browser, so renders cannot hang this way. Diagrams lose the
    #   lightbox zoom; that is the trade. See CLAUDE.md.
    lightbox: true         # still applies to images/plots, just not mermaid
    toc: true              # md to exclude: {.unnumbered .unlisted}
    toc-depth: 4
    toc-expand: 1
    number-sections: true  # md to exclude: {.unnumbered}
    number-depth: 4
    code-fold: true
    code-tools: true
    embed-resources: false # true for standalone
    # GA4 tag baked into every rendered notebook. Jekyll's _layouts/default.html
    # include only reaches the 3 pages with front matter (index/query/compare) —
    # the other ~60 notebook HTMLs are copied verbatim, so the tag has to come
    # from the Quarto render instead.
    include-in-header:
      - _output/_includes/analytics.html
date: now
date-format: iso
execute:
  echo: true
  warning: false
  message: true
editor:
  mode: source
  markdown:
    wrap: 72
  canonical: true
editor_options:
  chunk_output_type: console    
search: false
