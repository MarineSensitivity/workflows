<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- apply saved theme before stylesheet load to avoid a flash -->
  <script>
    document.documentElement.dataset.theme =
      localStorage.getItem("theme") || "dark";
  </script>

  <link rel="icon" type="image/x-icon" href="{{ '/assets/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>

<div id="layout">

  <header class="app-header">
    <a class="app-logo" href="{{ '/' | relative_url }}" aria-label="MarineSensitivity — home">🌊</a>
    <h1>{{ site.title }}</h1>

    <span class="spacer"></span>

    <nav class="header-links">
      <a href="https://app.marinesensitivity.org/scores_v8/">scores</a>
      <a href="https://app.marinesensitivity.org/species_v8/">species</a>
      <a href="{{ '/schema.html' | relative_url }}">schema</a>
      <a href="{{ '/query.html' | relative_url }}">query</a>
      <a href="{{ '/compare.html' | relative_url }}">compare</a>
      <a href="https://file.marinesensitivity.org/stac/">stac</a>
      <a href="https://github.com/MarineSensitivity/workflows">github</a>
    </nav>

    <button id="theme-toggle" type="button" aria-label="Toggle dark / light theme">🌓</button>
  </header>

  <main id="panel">
    {{ content }}
    <footer class="app-footer">
      <p>
        Source · <a href="https://github.com/MarineSensitivity/workflows">MarineSensitivity/workflows</a>
        · Apps · <a href="https://app.marinesensitivity.org/scores_v8/">scores</a>
        · <a href="https://app.marinesensitivity.org/species_v8/">species</a>
        · Data · <a href="https://file.marinesensitivity.org/stac/">STAC catalog</a>
      </p>
    </footer>
  </main>

</div>

<script>
  document.getElementById("theme-toggle").addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    localStorage.setItem("theme", next);
  });
</script>
</body>
</html>
