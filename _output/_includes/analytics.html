<!-- msens:analytics:begin -->
<!-- Google tag (gtag.js) — GA4 property 413466008 -->
<!--
  ONE measurement ID across every MarineSensitivity product: gtag scopes the
  `_ga` cookie to the registrable domain, so a single stream spans
  marinesensitivity.org and app.marinesensitivity.org. Products are separated in
  reporting by `content_group` — this site reports as 'workflows'.

  NOTE: do NOT write a literal Liquid include tag anywhere in this file, even
  inside an HTML comment — Liquid parses comments too, so a tag naming this file
  makes it include itself ("stack level too deep", ~10k frames).

  Used TWICE, because the site is half Jekyll and half standalone Quarto output:
    1. a Liquid include of this file in _layouts/default.html — covers the pages
       that carry Jekyll front matter (index, query, compare).
    2. `include-in-header` in ../../_quarto.yml — bakes it into every rendered
       notebook HTML (schema, validate_v7_v8, ingest_*, ...), which Jekyll copies
       verbatim and so never passes through the layout.
  Each page gets exactly one copy; the two paths are disjoint.
-->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-9HW6L751XG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-9HW6L751XG', { content_group: 'workflows' });

  // outbound clicks to the apps / STAC / GitHub — the header nav is the main
  // path from the workflows site into the rest of the toolkit, and a cross-host
  // navigation would otherwise be invisible here.
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="http"]');
    if (!a) return;
    var url = new URL(a.href, location.href);
    if (url.hostname === location.hostname) return;
    gtag('event', 'click_outbound', {
      content_group: 'workflows',
      link_domain: url.hostname,
      link_url: a.href.slice(0, 100),
      link_text: (a.textContent || '').trim().slice(0, 100)
    });
  }, true);
</script>
<!-- msens:analytics:end -->
