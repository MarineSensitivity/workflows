# MarineSensitivity Workflows — Jekyll site
#
# Built by .github/workflows/jekyll-gh-pages.yml from this _output/ directory.
# The landing page (index.html) is driven by _data/workflows.yml, which is
# generated from each notebook's `msens:` YAML front matter + the targets DAG by
# scripts/build_workflows_index.R (run it after adding/retitling notebooks or a
# pipeline run, then commit _data/workflows.yml).

title:       "MarineSensitivity Workflows"
description: "Reproducible Quarto / R notebooks that ingest marine species distribution models onto a global 0.05° grid, score marine sensitivity, and publish the v8 marine-atlas."
url:         "https://marinesensitivity.org"
baseurl:     "/workflows"
markdown:    kramdown

exclude:
  - README.md
  - LICENSE
  - "*.docx"
  - "*.pdf"
